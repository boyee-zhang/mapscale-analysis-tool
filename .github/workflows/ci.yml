name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint + Build (every push and PR) ─────────────────────────────────────────
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.9.10

      - name: Lint Python (ruff)
        run: ruff check api/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  # ── API Contract Tests (PRs only) ────────────────────────────────────────────
  # Runs against the Vercel preview deployment created for this PR.
  # This is the gate — the PR cannot be merged until all tests pass.
  # After merge, main is already verified — no need to re-test production.
  # Requires VERCEL_TOKEN secret in repo Settings → Secrets → Actions.
  contract:
    name: API Contract Tests
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test deps
        run: pip install pytest==8.3.5 httpx==0.27.0

      - name: Wait for Vercel preview deployment
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "Polling Vercel for PR preview (SHA=$SHA)..."
          for i in $(seq 1 24); do
            RESP=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?meta-githubCommitSha=$SHA&limit=1")
            STATE=$(echo "$RESP" | jq -r '.deployments[0].state // empty')
            URL=$(echo "$RESP" | jq -r '.deployments[0].url // empty')
            echo "  attempt $i/24 — state=$STATE"
            if [ "$STATE" = "READY" ]; then
              echo "url=https://$URL" >> "$GITHUB_OUTPUT"
              echo "Preview ready: https://$URL"
              exit 0
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "Vercel deployment failed (state=$STATE)"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for Vercel preview (6 minutes)"
          exit 1

      - name: Run API contract tests
        env:
          BASE_URL: ${{ steps.vercel.outputs.url }}
        run: pytest tests/ -v
