name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
      TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Start backend
        run: uvicorn api.main.app:app --port 8000 > /tmp/uvicorn.log 2>&1 &

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf "http://localhost:8000/api/main/health"; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting... ($i/20)"
            sleep 2
          done
          cat /tmp/uvicorn.log

      - name: Check ORS API key
        run: |
          echo "ORS_API_KEY length: ${#ORS_API_KEY}"
          HTTP=$(curl -s -o /tmp/ors_resp.json -w "%{http_code}" \
            -H "Authorization: ${ORS_API_KEY}" \
            -H "Content-Type: application/json" \
            -X POST "https://api.openrouteservice.org/v2/isochrones/foot-walking" \
            -d '{"locations":[[4.936,52.338]],"range":[600],"range_type":"time"}')
          echo "ORS direct HTTP status: $HTTP"
          cat /tmp/ors_resp.json

      - name: Run unit tests
        run: pytest tests/unit/ -v

      - name: Run integration tests
        run: pytest tests/integration/ -v --timeout=40 -p no:warnings

      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/uvicorn.log
