# Serves the built SPA and reproduces the two proxies that frontend/vite.config.js sets
# up for the dev server. The frontend calls same-origin paths (api.js uses baseURL: ''),
# so these prefixes are the whole frontend/backend contract in production too.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. It is here so that both proxy_pass targets below can be
    # VARIABLES: nginx resolves a literal hostname in proxy_pass once, at startup, and
    # refuses to start if it does not resolve yet. With a variable it starts anyway and
    # returns 502 until the backend appears — a container that boots and reports the
    # real problem beats one that exits before serving anything.
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Backend ─────────────────────────────────────────────────────────────
    # Path passed through unchanged: FastAPI's own routes carry the /api/main prefix.
    location /api/main/ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long enough for the slow paths rather than the median: a cold /isochrone
        # against the public ORS gateway, and /bekendmakingen over a 12-month window.
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
    }

    # ── AI service ──────────────────────────────────────────────────────────
    # A separate Vercel deployment (mapscale-ai-service), not part of this bundle. The
    # rewrite mirrors vite.config.js: /api/ai/<x> -> /api/<x> on that host.
    # If it is ever taken down, only the "AI analysis" button breaks; the map does not.
    location ~ ^/api/ai/(.*)$ {
        set $ai_upstream mapscale-ai-service.vercel.app;
        proxy_pass https://$ai_upstream/api/$1$is_args$args;
        proxy_http_version 1.1;
        # Both are required for TLS to a name: Host for routing on Vercel's edge,
        # proxy_ssl_server_name for SNI. Omitting the second gets a certificate error.
        proxy_set_header Host $ai_upstream;
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
    }

    # ── Static bundle ───────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed filenames under /assets, so they are immutable.
    # One add_header, not `expires 1y` as well: the two together emitted TWO
    # Cache-Control response headers ("max-age=31536000" and "public, immutable"),
    # which is legal but leaves which one wins up to the client.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single page app: there is one route today, but a deep link must not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
