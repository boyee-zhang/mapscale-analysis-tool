services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: mapscale-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    # arm64 mirror of postgis/postgis:16-3.4 — the official image is amd64-only and
    # would run under emulation on Apple Silicon, distorting every EXPLAIN timing.
    image: imresamu/postgis:16-3.4
    container_name: mapscale-pg
    environment:
      POSTGRES_USER: mapscale
      POSTGRES_PASSWORD: mapscale
      POSTGRES_DB: mapscale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Parameters are deliberately small so that disk spills, real buffer reads and
    # autovacuum activity are observable at ~10M rows instead of ~1B.
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=256MB
      -c autovacuum_naptime=10s
      -c track_io_timing=on
      -c log_min_duration_statement=100ms
      -c log_lock_waits=on
      -c log_autovacuum_min_duration=0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapscale"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  esdata:
  pgdata:
