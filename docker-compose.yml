services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: mapscale_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data

  martin:
    image: ghcr.io/maplibre/martin:v0.14.0 
    container_name: mapscale_martin
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:password@db/db
    depends_on:
      - db